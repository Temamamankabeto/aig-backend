name: Deploy Laravel Backend

on:
  push:
    branches:
      - main

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          test -n "$SSH_HOST" || {
            echo "::error::SSH_HOST is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "::error::SSH_USER is missing"
            exit 1
          }

          test -n "$SSH_PORT" || {
            echo "::error::SSH_PORT is missing"
            exit 1
          }

          test -n "$SSH_KEY" || {
            echo "::error::SSH_KEY is missing"
            exit 1
          }

          test -n "$REMOTE_PATH" || {
            echo "::error::REMOTE_PATH is missing"
            exit 1
          }

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            cd "${{ secrets.REMOTE_PATH }}"

            test -f artisan || {
              echo "Laravel artisan file not found"
              exit 1
            }

            test -f .env || {
              echo "Production .env file not found"
              exit 1
            }

            php artisan down --retry=30 || true

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            php artisan optimize:clear
            php artisan migrate --force
            php artisan db:seed --class=RolesPermissionsSeeder --force
            php artisan permission:cache-reset
            php artisan storage:link || true

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache

            php artisan up

            echo "Laravel backend deployed correctly"